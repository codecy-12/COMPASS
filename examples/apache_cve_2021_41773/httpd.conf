ServerRoot "/opt/httpd"
PidFile "/opt/httpd/logs/httpd.pid"
Listen 8080
ServerName localhost
ServerAdmin root@localhost
ErrorLog "/opt/httpd/logs/error_log"
LogLevel debug

User daemon
Group daemon

DocumentRoot "/opt/httpd/htdocs"
<Directory />
    AllowOverride none
    Require all granted
</Directory>

<Directory "/opt/httpd/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

ScriptAlias /cgi-bin/ "/opt/httpd/cgi-bin/"
<Directory "/opt/httpd/cgi-bin">
    AllowOverride None
    Options None
    Require all granted
</Directory>

TypesConfig conf/mime.types
AddType text/plain .txt
DirectoryIndex index.html

LoadFile /usr/lib/aarch64-linux-gnu/libcrypt.so.1
